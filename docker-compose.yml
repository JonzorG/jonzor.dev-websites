services:
  website:
    image: nginx:alpine
    container_name: jonzor-website
    restart: unless-stopped
    volumes:
      - ./website-files:/usr/share/nginx/html

  files:
    build: .
    container_name: jonzor-files
    restart: unless-stopped
    volumes:
      - ./file-data:/var/www/html/
      - /home/jonzor/shared-file-data:/var/www/html/shared
      - ./apache-config.conf:/etc/apache2/sites-available/000-default.conf:ro

  imposter:
    image: nginx:alpine
    container_name: jonzor-imposter
    restart: unless-stopped
    volumes:
      - ./imposter-files:/usr/share/nginx/html
      - /etc/localtime:/etc/localtime:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}

  linktree:
    image: nginx:alpine
    container_name: jonzor-linktree
    restart: unless-stopped
    volumes:
      - ./linktree-files:/usr/share/nginx/html

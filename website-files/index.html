<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Your Name]</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg?v=2">
</head>
<body>
    <div class="container">
        
        <!-- Introduction -->
        <header>
            <!-- Notice the span with the ID. The JS will inject your name here. -->
            <h1>Hi, I'm <span id="profile-name"></span>.</h1>
            <p class="subtitle" id="profile-role"></p>
            <p class="bio" id="profile-bio"></p>
            
            <div class="social-links">
                <a id="github-link" href="#" target="_blank" rel="noopener noreferrer">GitHub</a>
                <a id="linkedin-link" href="#" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            </div>
        </header>

        <!-- Projects (Keeping this static for now as requested) -->
        <main>
            <section>
                <h2>Selected Projects</h2>
                
                <div class="projects-list">
                    <article class="project-card">
                        <h3>Dockerized Web Hosting</h3>
                        <p>Configured a secure local server environment utilizing Docker and docker-compose. Exposed safely to the internet using Cloudflare Tunnels.</p>
                        <div class="tags">
                            <span class="tag">Docker</span>
                            <span class="tag">Linux</span>
                            <span class="tag">Networking</span>
                        </div>
                    </article>
                    
                    <!-- Other projects... -->
                </div>
            </section>
        </main>

        <footer>
            <!-- The title tag at the top still has [Your Name] hardcoded, but we can fix that with JS too! -->
            <p>&copy; <span id="current-year"></span> <span id="footer-name"></span></p>
        </footer>

    </div>

    <!-- ORDER MATTERS: Load the variables first, then the script that uses them -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>

<VirtualHost *:80>
    ServerAdmin you@example.com
    DocumentRoot /var/www/html

    # OVERRIDE APACHE'S DEFAULT /icons/ ALIAS
    # This forces Apache to use your Nextcloud volume mount instead of its system icons
    Alias /icons /var/www/html/icons

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # CRITICAL: Prevent direct access to the hidden directory
    <DirectoryMatch "^/var/www/html/shared/hidden">
        Require all denied
    </DirectoryMatch>

    # 404 Redirect for hidden files to prevent directory discovery
    RedirectMatch 404 ^/shared/hidden(/.*)?$

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
